<!doctype html>
<html lang="{{site.htmlLang}}" data-lang="{{code}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{fullTitle}}</title>
  <meta name="description" content="{{page.description}}">
  <link rel="canonical" href="{{canonical}}">
{{hreflang}}
  <meta name="theme-color" content="#faf6ef">
  <link rel="stylesheet" href="../css/style.css?v={{v}}">
  <!-- Google Analytics -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    // 本番（solo-living-diary.nacn.app）でだけ計測する。プレビュー（*.pages.dev）や手元では読み込まない。
    // gtag() はどのホストでも定義するので、ゲームの gtag('event', …) はエラーにならない（送られないだけ）
    if (location.hostname === 'solo-living-diary.nacn.app') {
      var ga = document.createElement('script');
      ga.async = true;
      ga.src = 'https://www.googletagmanager.com/gtag/js?id=G-NH0RLHNX0K';
      document.head.appendChild(ga);
      gtag('js', new Date());
      gtag('config', 'G-NH0RLHNX0K');
    }
  </script>
</head>
<body>
  <main id="app" class="doc">
    <a class="doc-back" href="./">← {{meta.gameName}}</a>
    <h1>{{page.title}}</h1>
    <article class="doc-body">
{{body}}
    </article>
{{siteNav}}
{{langNav}}
  </main>
{{suggestBanner}}
</body>
</html>
